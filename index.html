<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="車牌查詢">
  <title>校園車牌查詢</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <section id="view-loading" class="view view-center">
    <div class="spinner" aria-label="載入中"></div>
  </section>

  <!-- 登入畫面 -->
  <section id="view-login" class="view view-center" hidden>
    <div class="login-card">
      <img src="icons/icon-192.png" class="logo" alt="" width="72" height="72">
      <h1>校園車牌查詢</h1>
      <p class="muted">請使用學校 Google 帳號登入<br>僅限授權人員使用</p>
      <div id="login-button" class="gsi-slot"></div>
      <p id="login-status" class="status" role="status"></p>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="view-main" class="view" hidden>
    <header class="topbar">
      <h1>校園車牌查詢</h1>
      <div class="user">
        <span id="user-name"></span>
        <button id="btn-logout" type="button" class="btn-text">登出</button>
      </div>
    </header>

    <main class="content">
      <div id="data-status" class="data-status">
        <div class="data-info">
          <strong id="data-count"></strong>
          <span id="data-time"></span>
        </div>
        <button id="btn-download" type="button" class="btn">資料下載</button>
      </div>

      <div id="expired-banner" class="banner banner-danger" hidden>
        名單已超過有效期限，請按「資料下載」更新後再查詢。
      </div>

      <form id="search-form" class="search" autocomplete="off">
        <input id="search-input" type="text" inputmode="text" autocapitalize="characters"
               autocorrect="off" spellcheck="false" enterkeyhint="search"
               placeholder="輸入車牌或數字，例如 ABC-1234、1234" aria-label="車牌號碼">
        <button type="submit" class="btn btn-primary">查詢</button>
      </form>

      <div id="results" class="results" aria-live="polite"></div>

      <nav class="modes" aria-label="辨識模式">
        <button id="btn-photo-camera" type="button" class="mode mode-on">📷 拍照辨識<small>用相機拍車牌</small></button>
        <button id="btn-photo-album" type="button" class="mode mode-on">🖼️ 相簿辨識<small>選已拍好的照片</small></button>
        <button type="button" class="mode" disabled>🎥 即時辨識<small>第 3 階段開放</small></button>
      </nav>
    </main>
  </section>

  <!-- 拍照辨識 -->
  <section id="view-photo" class="view" hidden>
    <header class="topbar">
      <button id="btn-photo-back" type="button" class="btn-text">‹ 返回</button>
      <h1>拍照辨識</h1>
      <span class="topbar-spacer"></span>
    </header>
    <main class="content">
      <div id="photo-stage" class="stage">
        <canvas id="photo-canvas"></canvas>
        <div id="photo-overlay" class="overlay"></div>
        <div id="photo-busy" class="busy" hidden>
          <div class="spinner"></div>
          <p id="photo-busy-text"></p>
        </div>
      </div>
      <p id="photo-summary" class="status" role="status"></p>
      <div class="photo-actions">
        <button id="btn-retake" type="button" class="btn">📷 重拍</button>
        <button id="btn-album2" type="button" class="btn">🖼️ 相簿</button>
        <button id="btn-mark" type="button" class="btn">✏️ 框選車牌</button>
      </div>
      <div id="photo-results" class="photo-results"></div>
    </main>
  </section>

  <!-- 照片來源：相機、相簿（照片只在手機上處理，不會上傳） -->
  <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="file-album" type="file" accept="image/*" hidden>

  <!-- 車主資訊卡 -->
  <dialog id="dlg-owner" class="sheet"></dialog>

  <!-- 重新下載時確認身分 -->
  <dialog id="dlg-download" class="sheet">
    <h2>更新名單</h2>
    <p class="muted">請再次確認您的 Google 帳號，以下載最新名單。</p>
    <div id="download-button" class="gsi-slot"></div>
    <p id="download-status" class="status" role="status"></p>
    <button type="button" class="btn btn-block" data-close>取消</button>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
